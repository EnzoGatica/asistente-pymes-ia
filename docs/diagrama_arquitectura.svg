<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700">Arquitectura de la miniaplicación — src/consumir_openai.py</text>
  <text x="600" y="58" text-anchor="middle" font-size="14" fill="#555">Flujo de una pregunta: obtener_respuesta(pregunta) llama a las funciones en este orden</text>

  <!-- Usuario -->
  <rect x="30" y="110" width="150" height="70" rx="10" fill="#eef2f7" stroke="#34495e" stroke-width="2"/>
  <text x="105" y="140" text-anchor="middle" font-size="15" font-weight="700">Usuario</text>
  <text x="105" y="160" text-anchor="middle" font-size="12">main.py / consola</text>

  <!-- armar_peticion -->
  <rect x="250" y="95" width="220" height="100" rx="10" fill="#e8f6ef" stroke="#27ae60" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-size="15" font-weight="700">1. armar_peticion</text>
  <text x="360" y="144" text-anchor="middle" font-size="12">valida pregunta no vacía</text>
  <text x="360" y="162" text-anchor="middle" font-size="12">arma model + messages</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#c0392b">raise ValueError si vacía</text>

  <!-- enviar_peticion -->
  <rect x="560" y="80" width="280" height="130" rx="10" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <text x="700" y="106" text-anchor="middle" font-size="15" font-weight="700">2. enviar_peticion</text>
  <text x="700" y="127" text-anchor="middle" font-size="12">lee OPENAI_API_KEY → header Authorization: Bearer</text>
  <rect x="575" y="138" width="250" height="62" rx="6" fill="#fff" stroke="#c0392b" stroke-dasharray="5,4"/>
  <text x="700" y="155" text-anchor="middle" font-size="11" fill="#c0392b">try requests.post(timeout=30)</text>
  <text x="700" y="170" text-anchor="middle" font-size="11" fill="#c0392b">except ConnectionError/Timeout → RuntimeError</text>
  <text x="700" y="185" text-anchor="middle" font-size="11" fill="#c0392b">try respuesta.json() except JSONDecodeError</text>
  <text x="700" y="198" text-anchor="middle" font-size="11" fill="#c0392b">status ≠ 200 (401, 429…) → RuntimeError</text>

  <!-- API -->
  <rect x="930" y="95" width="240" height="100" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
  <text x="1050" y="125" text-anchor="middle" font-size="15" font-weight="700">API OpenAI</text>
  <text x="1050" y="147" text-anchor="middle" font-size="12">POST /v1/chat/completions</text>
  <text x="1050" y="166" text-anchor="middle" font-size="12">modelo gpt-4.1-nano</text>

  <!-- .env -->
  <rect x="580" y="290" width="240" height="70" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="318" text-anchor="middle" font-size="15" font-weight="700">.env (fuera de Git)</text>
  <text x="700" y="340" text-anchor="middle" font-size="12">OPENAI_API_KEY · cargado con load_dotenv()</text>

  <!-- extraer_texto -->
  <rect x="560" y="440" width="280" height="100" rx="10" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="700" y="468" text-anchor="middle" font-size="15" font-weight="700">3. extraer_texto</text>
  <text x="700" y="490" text-anchor="middle" font-size="12">choices[0].message.content</text>
  <text x="700" y="510" text-anchor="middle" font-size="11" fill="#c0392b">except KeyError/IndexError/TypeError</text>
  <text x="700" y="525" text-anchor="middle" font-size="11" fill="#c0392b">→ RuntimeError ("no trae el texto…")</text>

  <!-- calcular_costo -->
  <rect x="930" y="440" width="240" height="100" rx="10" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="1050" y="468" text-anchor="middle" font-size="15" font-weight="700">4. calcular_costo</text>
  <text x="1050" y="490" text-anchor="middle" font-size="12">usage.prompt_tokens × precio entrada</text>
  <text x="1050" y="508" text-anchor="middle" font-size="12">+ completion_tokens × precio salida</text>
  <text x="1050" y="526" text-anchor="middle" font-size="12">PRECIOS (USD / 1M tokens)</text>

  <!-- try/except del llamador -->
  <rect x="30" y="600" width="520" height="110" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="290" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Llamador (main / __main__)</text>
  <text x="290" y="652" text-anchor="middle" font-size="12">try: texto, costo = obtener_respuesta(pregunta)</text>
  <text x="290" y="672" text-anchor="middle" font-size="12">except (ValueError, RuntimeError) as error:</text>
  <text x="290" y="692" text-anchor="middle" font-size="12">    print("No se pudo completar la operación:", error)</text>

  <!-- flechas camino feliz -->
  <line x1="180" y1="145" x2="248" y2="145" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="214" y="135" text-anchor="middle" font-size="11">pregunta</text>
  <line x1="470" y1="145" x2="558" y2="145" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="514" y="128" text-anchor="middle" font-size="11">url, body</text>
  <line x1="840" y1="125" x2="928" y2="125" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="884" y="117" text-anchor="middle" font-size="11">HTTPS + JSON</text>
  <line x1="928" y1="170" x2="842" y2="170" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="884" y="188" text-anchor="middle" font-size="11">JSON crudo</text>
  <line x1="700" y1="288" x2="700" y2="212" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="712" y="255" font-size="11" fill="#c0392b">os.getenv("OPENAI_API_KEY")</text>
  <line x1="660" y1="212" x2="660" y2="438" stroke="#333" stroke-width="2" marker-end="url(#f)" stroke-dasharray="0"/>
  <text x="560" y="400" font-size="11">datos (dict con choices + usage)</text>
  <line x1="800" y1="212" x2="1000" y2="438" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="905" y="300" font-size="11">datos["usage"]</text>
  <line x1="558" y1="500" x2="160" y2="182" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="300" y="330" font-size="11" transform="rotate(38 300 330)">texto de la respuesta</text>
  <line x1="1050" y1="542" x2="1050" y2="590" stroke="#333" stroke-width="2"/>
  <line x1="1050" y1="590" x2="552" y2="640" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="820" y="602" font-size="11">costo en USD (float)</text>

  <!-- flechas de error -->
  <path d="M360,195 C360,420 300,520 290,598" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r)"/>
  <text x="330" y="420" font-size="11" fill="#c0392b">ValueError</text>
  <path d="M580,212 C560,380 480,520 450,598" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r)"/>
  <text x="470" y="560" font-size="11" fill="#c0392b">RuntimeError</text>

  <text x="1170" y="745" text-anchor="end" font-size="11" fill="#888">Rojo punteado = camino de error · Negro = camino exitoso</text>
</svg>
